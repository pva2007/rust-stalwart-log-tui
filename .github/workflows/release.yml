name: Release

# Build release binaries for 4 targets and publish them on a GitHub release.
# Triggered by pushing a version tag (v*) or manually via workflow_dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            zig: false
          - os: macos-latest
            target: x86_64-apple-darwin
            zig: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux targets cross-compile from the Ubuntu runner via zig (musl =
      # fully static binaries). macOS targets build natively: the runner's
      # Xcode toolchain handles both x86_64 and aarch64.
      - name: Install zig
        if: matrix.zig
        run: python3 -m pip install ziglang

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo install --locked cargo-zigbuild
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          dir="stalwart-log-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/stalwart-log" "$dir/"
          cp README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            stalwart-log-*.tar.gz
            stalwart-log-*.tar.gz.sha256
          generate_release_notes: true
